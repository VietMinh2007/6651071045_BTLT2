<html>
<head>
    <title>Tạo form và các điều khiển trên form</title>
</head>
<body>
    <div align="center">
        <h2><font color="#8B4513">Đăng nhập</font></h2>
        <form>
            <table border="1" bordercolor="#4682B4" bgcolor="#D9EBF9" width="300" cellpadding="4" cellspacing="0">
                <tr>
                    <td width="40%">Mã người dùng</td>
                    <td><input type="text" value="ptnhung" size="20"></td>
                </tr>
                <tr>
                    <td>Mật khẩu:</td>
                    <td><input type="password" value="12345678" size="20"></td>
                </tr>
                <tr>
                    <td colspan="2" align="center">
                        <!-- Nút bấm tĩnh trong HTML -->
                        <input type="button" value="Đồng ý">
                    </td>
                </tr>
                <tr>
                    <td colspan="2" align="center">
                        <font color="#0000FF"><b>ptnhung</b></font>
                    </td>
                </tr>
            </table>
        </form>
    </div>
</body>
</html>
